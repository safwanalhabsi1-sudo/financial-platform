<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>بوصلة وعي المالية</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f4;color:#17231c}.wrap{max-width:760px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#173d2d,#0f2c22);color:white;padding:34px;border-radius:24px;box-shadow:0 12px 30px #0002}.brand{font-size:14px;opacity:.8}.hero h1{font-size:38px;margin:8px 0}.hero p{line-height:1.9}.card{background:white;margin-top:18px;padding:28px;border-radius:22px;box-shadow:0 8px 25px #00000012}.progress{height:8px;background:#e7ece8;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:#2f7354;transition:.3s}.q{font-size:22px;font-weight:bold;line-height:1.6;margin-bottom:18px}.opt{display:block;width:100%;text-align:right;border:1px solid #dce5df;background:#fafcfb;padding:15px 16px;margin:10px 0;border-radius:15px;font-size:16px;cursor:pointer}.opt:hover{border-color:#2f7354;background:#f0f7f3}.btn{border:0;background:#d6ad52;color:#14251c;padding:14px 25px;border-radius:14px;font-weight:bold;font-size:17px;cursor:pointer}.center{text-align:center}.badge{font-size:54px}.result h2{font-size:28px}.tag{display:inline-block;background:#edf5f0;padding:8px 12px;border-radius:20px;margin:4px}.small{font-size:13px;color:#6b756e}.hidden{display:none}@media(max-width:600px){.wrap{padding:14px}.hero{padding:25px}.hero h1{font-size:30px}.card{padding:20px}.q{font-size:19px}}
</style></head><body><main class='wrap'><section class='hero center' id='intro'><div class='brand'>منصة وعي</div><h1>🧭 بوصلة وعي المالية</h1><p>6 مواقف قصيرة تكشف التوجهات التي تقود قراراتك المالية. لا توجد إجابة صحيحة أو خاطئة؛ اختر ما يشبه تصرفك الحقيقي.</p><button class='btn' onclick='start()'>ابدأ البوصلة</button></section><section class='card hidden' id='quiz'><div class='progress'><div class='bar' id='bar'></div></div><div class='small' id='count'></div><div class='q' id='q'></div><div id='opts'></div></section><section class='card result center hidden' id='result'></section></main><script>
const types={growth:{icon:'🌱',name:'النمو والاستثمار',desc:'تميل إلى التفكير في تنمية المال وتحويله إلى فرص مستقبلية.'},security:{icon:'🛡️',name:'الأمان المالي',desc:'تهتم بالاحتياط والاستقرار وتقليل المفاجآت المالية.'},goals:{icon:'🎯',name:'التخطيط والأهداف',desc:'تربط قراراتك المالية بأهداف واضحة وأولويات محددة.'},enjoy:{icon:'🎁',name:'الاستمتاع والمكافأة',desc:'ترى المال وسيلة للاستمتاع ومكافأة نفسك ومن تحب.'},impulse:{icon:'⚡',name:'الإنفاق الاندفاعي',desc:'قد تتخذ بعض قرارات الشراء بسرعة تحت تأثير اللحظة.'},social:{icon:'👥',name:'التأثر بالمجتمع',desc:'قد تتأثر قراراتك بما يفعله أو يتوقعه الأشخاص من حولك.'}};
const qs=[['حصلت على مكافأة مالية غير متوقعة. ما أول شيء تفكر فيه؟',[['أستثمر جزءًا منها في فرصة تنمّي مالي','growth'],['أضعها في صندوق الطوارئ','security'],['أستخدمها لهدف مالي كنت أخطط له','goals'],['أكافئ نفسي بشيء كنت أريده','enjoy']]],['رأيت هاتفًا جديدًا يعجبك بينما هاتفك الحالي يعمل جيدًا. ماذا تفعل؟',[['أشتريه فورًا إذا كان معي المبلغ','impulse'],['أفكر هل يخدم هدفًا أو حاجة حقيقية','goals'],['أنتظر وأقارن قبل اتخاذ القرار','security'],['إذا كان أغلب من حولي قد اقتناه فقد أتحمس له','social']]],['تبقى لديك 80 ريالًا قبل نهاية الشهر. ماذا تفعل غالبًا؟',[['أضيفها للادخار أو الاحتياطي','security'],['أبحث عن طريقة لتنميتها','growth'],['أخصصها لهدف قادم','goals'],['أستمتع بجزء منها الآن','enjoy']]],['أصدقاؤك يخططون لرحلة مكلفة لم تكن ضمن ميزانيتك. ما الأقرب لك؟',[['أذهب حتى لا أفوّت التجربة معهم','social'],['أوافق بسرعة ثم أفكر لاحقًا في التكلفة','impulse'],['أعتذر إن كانت ستؤثر في أولوياتي','goals'],['أبحث عن خيار أقل تكلفة يحقق المتعة','enjoy']]],['تفكر في شراء شيء بالتقسيط لمدة طويلة. ماذا يحسم قرارك؟',[['هل القسط يناسب وضعي المالي والطوارئ','security'],['هل الشراء يخدم هدفي فعلًا','goals'],['إذا أعجبني جدًا قد أبدأ القسط مباشرة','impulse'],['هل يمكن توجيه المبلغ لشيء ينمو مستقبلاً','growth']]],['زاد دخلك الشهري 10%. ما التصرف الأقرب لك؟',[['أرفع نسبة الاستثمار','growth'],['أزيد احتياطي الأمان','security'],['أرفع مستوى مشترياتي واستمتاعي','enjoy'],['قد يزيد إنفاقي لأن المحيط يتوقع مستوى أعلى','social']]]];
let i=0,s={growth:0,security:0,goals:0,enjoy:0,impulse:0,social:0};function start(){intro.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){count.textContent=`السؤال ${i+1} من ${qs.length}`;bar.style.width=((i)/qs.length*100)+'%';q.textContent=qs[i][0];opts.innerHTML='';qs[i][1].forEach(x=>{let b=document.createElement('button');b.className='opt';b.textContent=x[0];b.onclick=()=>pick(x[1]);opts.appendChild(b)})}function pick(t){s[t]++;i++;if(i<qs.length)render();else finish()}function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');let sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);let main=sorted.filter(x=>x[1]>=3);if(!main.length)main=[sorted[0]];let top=main[0],extra=main.slice(1);result.innerHTML=`<div class='small'>منصة وعي • نتيجة بوصلة وعي المالية</div><div class='badge'>${types[top[0]].icon}</div><h2>نمطك المالي الغالب: ${types[top[0]].name}</h2><p>${types[top[0]].desc}</p>${extra.length?`<p><b>ولديك توجه بارز أيضًا:</b> ${extra.map(x=>types[x[0]].icon+' '+types[x[0]].name).join('، ')}</p>`:''}<div>${sorted.map(x=>`<span class='tag'>${types[x[0]].icon} ${types[x[0]].name}: ${x[1]}</span>`).join('')}</div><p class='small'>هذه النتيجة أداة توعوية وليست تقييمًا نفسيًا أو ماليًا تشخيصيًا.</p><button class='btn' onclick='location.reload()'>إعادة التجربة</button>`}
</script></body></html>
